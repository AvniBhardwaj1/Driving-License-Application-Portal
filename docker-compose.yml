services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rto_portal
      POSTGRES_USER: rto_user
      POSTGRES_PASSWORD: rto_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rto_user -d rto_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://rto_user:rto_password@database:5432/rto_portal
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy
